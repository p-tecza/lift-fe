<div style="background: black; font-family: monospace;">
  <div style="text-align: center; margin-top: 3%">
    <h1 style="font-family: monospace;">Historic data</h1>
  </div>
  <div class="filter-container">
    <mat-form-field>
      <mat-label>Data od</mat-label>
      <input matInput [(ngModel)]="startDate" type="date">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Data do</mat-label>
      <input matInput [(ngModel)]="endDate" type="date">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="applyDateFilter()" class="filter-button">
      Filter
    </button>

    <button mat-button (click)="clearFilters()" class="clear-button">
      Clear filters
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- ID Column -->

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td class = 'pointer' mat-cell *matCellDef="let element" (click)="openModal(element.id)">{{ sliceString(element.id, 8) }}</td>
    </ng-container>

    <!-- Title Column -->
    <ng-container matColumnDef="subject">
      <th mat-header-cell *matHeaderCellDef>Subject</th>
      <td class = 'pointer' mat-cell *matCellDef="let element" (click)="openModal(element.id)">{{ sliceString(element.subject, 16) }}</td>
    </ng-container>

    <!-- Amount Column -->
    <ng-container matColumnDef="result">
      <th mat-header-cell *matHeaderCellDef>Result</th>
      <td mat-cell *matCellDef="let element">{{ element.result }}</td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="problem">
      <th mat-header-cell *matHeaderCellDef>Problem %</th>
      <td mat-cell *matCellDef="let element">{{ element.problemProb }}</td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="change">
      <th mat-header-cell *matHeaderCellDef>Change %</th>
      <td mat-cell *matCellDef="let element">{{ element.changeProb }}</td>
    </ng-container>

    <ng-container matColumnDef="request">
      <th mat-header-cell *matHeaderCellDef>Request %</th>
      <td mat-cell *matCellDef="let element">{{ element.reqProb }}</td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let element">{{ element.date | date:'dd.MM.yyyy' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator
    [length]="totalItems"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
</div>
